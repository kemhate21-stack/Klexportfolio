<!--
  Portfolio upgrade patch (Kem Hate / Klex)
  1. Glow behind every box
  2. Accessibility button -> accessibility icon
  3. Remove dead space (empty grid cells, half-empty cards, oversized margins)

  HOW TO APPLY (2 steps):
  STEP 1: Copy the whole <style> block below and paste it right ABOVE </head> in your index.html.
  STEP 2: Find this line in your index.html:
            <button aria-expanded="false" id="ab" type="button">Accessibility</button>
          Replace it with the <button> at the bottom of this file.
-->

<!-- ===== STEP 1: paste above </head> ===== -->
<style id="upgrade">
/* ---------- 1. Glow behind every box ---------- */
:root{--glow:rgba(110,130,255,.30);--glow2:rgba(0,200,255,.16)}
:root[data-theme=light]{--glow:rgba(70,100,220,.20);--glow2:rgba(255,150,80,.14)}
:root[data-theme] .card,:root[data-theme] .tools,:root[data-theme] .bb,:root[data-theme] #ab{
  box-shadow:0 0 22px -4px var(--glow),0 0 60px -14px var(--glow2)}
:root[data-theme] .pj{box-shadow:0 0 14px -6px var(--glow)}
:root[data-theme] .card{transition:opacity .7s,transform .3s,border-color .3s,box-shadow .3s}
:root[data-theme] .card:hover{border-color:color-mix(in srgb,var(--glow) 70%,var(--line));
  box-shadow:0 0 34px -2px var(--glow),0 0 90px -10px var(--glow2)}

/* ---------- 2. Accessibility icon button ---------- */
#ab{width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center}
#ab svg{width:26px;height:26px}
.acc div{bottom:56px}

/* ---------- 3. Remove dead space ---------- */
main{max-width:none;padding-bottom:90px}
.tools{margin:20px 0}
.grid{grid-auto-flow:dense}                 /* back-fill empty cells */
#projects,#services{grid-column:span 6}     /* no lone half-width card on its page */
.website-marquee-track{grid-template-columns:repeat(3,minmax(0,1fr))}
#services .ol{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
#services .ol li:nth-child(2){border-top:0}
/* credentials list fills its card instead of leaving a gap */
.card:has(#cred){display:flex;flex-direction:column}
.card:has(#cred) .cl{flex:1;height:0;min-height:290px;max-height:none}
/* contact form stretches to match the calendar beside it */
#contact{display:flex;flex-direction:column}
#contact form{flex:1;grid-template-rows:auto auto 1fr auto auto}
@media(min-width:901px){.card:has(.calendly-inline-widget){grid-column:span 3}}
@media(max-width:900px){
  #services .ol{grid-template-columns:1fr}
  #services .ol li:nth-child(2){border-top:1px solid var(--line)}
  .website-marquee-track{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acc{bottom:16px}
}
</style>

<!-- ===== STEP 2: replace the old Accessibility button with this ===== -->
<button aria-expanded="false" aria-label="Accessibility options" title="Accessibility" id="ab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="7" r="1.4" fill="currentColor" stroke="none"/><path d="M7 9.6l5 1.1 5-1.1M12 10.7v3.6M12 14.3l-2.5 4.2M12 14.3l2.5 4.2"/></svg></button>
